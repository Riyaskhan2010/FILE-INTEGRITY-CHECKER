services:
  # ── Flask Backend ──────────────────────────────────────────────────────────
  - type: web
    name: file-integrity-checker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0

  # ── React Frontend ─────────────────────────────────────────────────────────
  - type: web
    name: file-integrity-checker
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://file-integrity-checker-hawn.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
